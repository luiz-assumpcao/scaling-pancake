name: Continuous Delivery
on:
  push:
    branches: [main]

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Simulating Continuous Delivery
        uses: actions/upload-artifact@v7
        with:
          name: zipedproject.zip
          path: |
            main.py
            READ.md
